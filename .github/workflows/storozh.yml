# Сторож (спека «GitHub: репозиторий и публикатор», Р29, Р70, Р72).
# Судит последний слот, чьё окно (начало + 40 минут) закрылось к запуску: расписание GitHub опаздывает
# на часы. Публикатор слот не обработал и заявки агента к нему нет — в канал строка «⚠️ Выпуск <час
# слота> не собран: агент не прислал выпуск». Расписание запускается только из основной ветки —
# секреты environment publikaciya ему доступны. Состояние сторож не пишет. Режим проверки —
# переменная репозитория NEWSAI_REZHIM_PROVERKI=1 в окружении job'а: сторож молчит, шаг «Заявки» пропущен.
name: storozh

on:
  schedule:
    - cron: "40 2,10,18 * * *"     # 09:40, 17:40, 01:40 по Бангкоку

permissions: {}

concurrency:
  group: storozh
  cancel-in-progress: false

jobs:
  storozh:
    runs-on: ubuntu-latest
    environment: publikaciya
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      NEWSAI_REZHIM_PROVERKI: ${{ vars.NEWSAI_REZHIM_PROVERKI }}
    steps:
      # Событие schedule идёт только с последнего коммита основной ветки: её и чекаутим.
      - name: Код основной ветки
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # В режиме проверки сторож молчит и заявок не читает: запрос REST не нужен, его отказ не
      # красит job.
      - name: Заявки за последнее время
        if: env.NEWSAI_REZHIM_PROVERKI != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Заявки слота уже могут быть закрыты публикатором — берём все, свежие первыми.
          gh api "repos/$GITHUB_REPOSITORY/pulls?state=all&sort=created&direction=desc&per_page=50" \
            > "$RUNNER_TEMP/zayavki.json"

      - name: Сторож
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 -m newsai storozh --zayavki "$RUNNER_TEMP/zayavki.json"
